<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#16324f" />
    <meta name="description" content="Painel de gestão de imóveis e aluguéis da Espaço VIP" />
    <title>Espaço VIP | Gestão de Imóveis</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">EV</div>
          <div>
            <strong>Espaço VIP</strong>
            <span>Gestão de imóveis</span>
          </div>
        </div>

        <nav class="main-nav" aria-label="Navegação principal">
          <button class="nav-item active" data-view="dashboard">
            <span class="nav-icon" data-icon="dashboard"></span>
            <span>Visão geral</span>
          </button>
          <button class="nav-item" data-view="properties">
            <span class="nav-icon" data-icon="building"></span>
            <span>Imóveis</span>
            <span class="nav-count" id="propertyNavCount">36</span>
          </button>
          <button class="nav-item" data-view="payments">
            <span class="nav-icon" data-icon="money"></span>
            <span>Pagamentos</span>
          </button>
          <button class="nav-item" data-view="agenda">
            <span class="nav-icon" data-icon="calendar"></span>
            <span>Agenda</span>
            <span class="nav-alert" id="agendaNavCount">9</span>
          </button>
          <button class="nav-item" data-view="history">
            <span class="nav-icon" data-icon="history"></span>
            <span>Histórico</span>
          </button>
          <button class="nav-item" data-view="documents">
            <span class="nav-icon" data-icon="folder"></span>
            <span>Documentos</span>
          </button>
        </nav>

        <div class="sidebar-footer">
          <div class="sync-card">
            <span class="sync-dot"></span>
            <div>
              <strong>Base consolidada</strong>
              <span>Atualizada em 14/08/2026</span>
            </div>
          </div>
          <button class="nav-item" data-view="settings">
            <span class="nav-icon" data-icon="settings"></span>
            <span>Configurações</span>
          </button>
        </div>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <button class="icon-button mobile-menu" id="mobileMenu" aria-label="Abrir menu">
            <span data-icon="menu"></span>
          </button>
          <div class="global-search">
            <span data-icon="search"></span>
            <input id="globalSearch" type="search" placeholder="Buscar imóvel, sala ou inquilino..." autocomplete="off" />
            <kbd>⌘ K</kbd>
          </div>
          <div class="topbar-actions">
            <button class="icon-button notification-button" aria-label="Notificações" data-open-agenda>
              <span data-icon="bell"></span>
              <span class="notification-dot"></span>
            </button>
            <div class="profile">
              <div class="avatar">EV</div>
              <div>
                <strong>Administração</strong>
                <span>Espaço VIP</span>
              </div>
            </div>
          </div>
        </header>

        <div id="app" class="page-container" aria-live="polite"></div>
      </main>
    </div>

    <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
    <aside class="property-drawer" id="propertyDrawer" aria-label="Detalhes do imóvel" aria-hidden="true"></aside>

    <div class="modal-backdrop" id="modalBackdrop" hidden>
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-header">
          <div>
            <span class="eyebrow">Novo registro</span>
            <h2 id="modalTitle">Adicionar acompanhamento</h2>
          </div>
          <button class="icon-button" id="closeModal" aria-label="Fechar"><span data-icon="close"></span></button>
        </div>
        <form id="activityForm" class="modal-form">
          <input type="hidden" id="activityPropertyId" />
          <label>
            Tipo de registro
            <select id="activityType" required>
              <option value="Contato">Contato com inquilino</option>
              <option value="Reajuste">Andamento do reajuste</option>
              <option value="Pagamento">Pagamento</option>
              <option value="Contrato">Contrato</option>
              <option value="Documento">Documento</option>
              <option value="Observação">Observação</option>
            </select>
          </label>
          <label>
            Descrição
            <textarea id="activityDescription" rows="4" placeholder="Ex.: Notificação de reajuste enviada pelo WhatsApp" required></textarea>
          </label>
          <div class="modal-actions">
            <button type="button" class="button secondary" id="cancelModal">Cancelar</button>
            <button type="submit" class="button primary"><span data-icon="check"></span> Salvar registro</button>
          </div>
        </form>
      </section>
    </div>

    <div class="toast-region" id="toastRegion" aria-live="assertive"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
